<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Prayer Guide Placeholder</title>
  <desc id="desc">A simple placeholder graphic for the monthly prayer guide image area.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="800" height="1000" fill="url(#bg)" rx="40"/>
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="140" cy="160" r="6"/>
    <circle cx="650" cy="120" r="4"/>
    <circle cx="720" cy="260" r="5"/>
