<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple-Style Glassmorphism Sidebar</title>
    <link rel="stylesheet" href="CSS/funstyles.css">
    <link rel="stylesheet" href="CSS/styles.css">
    <link rel="stylesheet" href="CSS/styles-responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <i class="fab fa-apple"></i>
            </div>
            <nav class="menu">
                <ul>
                    <li class="active">
                        <a href="#">
                            <i class="fas fa-home"></i>
                            <span>Home</span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class="fas fa-compass"></i>
                            <span>Journey</span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class="fas fa-chart-simple"></i>
                            <span>About Us</span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class="fas fa-message"></i>
                            <span>Resources</span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class="fas fa-folder"></i>
                            <span>Contact Us</span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class="fas fa-bookmark"></i>
                            <span>Prayer</span>
                        </a>
                    </li>
                </ul>
            </nav>
            
        </aside>
        <main class="content">
            <header>
                <h1 class="mainSubject">Guardians of Purity</h1>
            </header>
             <section class="separated_block">
        <div class="parallax separated_block_corner">
          <section class="parallax__header">
            <div class="parallax__visuals">
              <div class="parallax__black-line-overflow"></div>
              <div data-parallax-layers class="parallax__layers">
                <img
                  src="./img/manJumping3.jpg"
                  loading="eager"
                  width="800"
                  data-parallax-layer="1"
                  alt=""
                  class="parallax__layer-img"
                />
                <img
                  src="./img/manJumping2.png"
                  loading="eager"
                  width="800"
                  data-parallax-layer="2"
                  alt=""
                  class="parallax__layer-img"
                />
                <div data-parallax-layer="3" class="parallax__layer-title">
                  <h2 class="parallax__title" style="color: skyblue">
                    BREAK FREE<br />
                    LIVE PURE<br />WALK IN PURPOSE
                  </h2>
                </div>
                <img
                  src="./img/ManJ.png"
                  loading="eager"
                  width="800"
                  data-parallax-layer="4"
                  alt=""
                  class="parallax__layer-img"
                />
              </div>
              <div class="parallax__fade"></div>
            </div>
          </section>
        </div>
      </section>
            <div class="card-container">
                <div class="card">
                    <div class="card-icon">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="card-info">
                        <h3>12</h3>
                        <p>Completed Tasks</p>
                    </div>
                </div>
                <div class="card">
                    <div class="card-icon">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="card-info">
                        <h3>5</h3>
                        <p>Pending Tasks</p>
                    </div>
                </div>
                <div class="card">
                    <div class="card-icon">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="card-info">
                        <h3>7</h3>
                        <p>Active Projects</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="funScript.js"></script>
    <script src="script.js"></script>
</body>
</html>
